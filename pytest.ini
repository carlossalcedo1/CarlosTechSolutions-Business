# Run from the repo root: `pytest` (deploy.sh does exactly that).
#
# pythonpath = . so tests import `backend.app.*` — the same path the
# container uses (backend/Dockerfile sets PYTHONPATH=/app and runs
# backend.app.main:app). Importing as `app.*` would also work locally but
# would exercise a module path production never uses.
[pytest]
pythonpath = .
testpaths = backend/tests
addopts = -q --strict-markers
# Warnings are errors, so a new deprecation in a dependency shows up as a
# failing test rather than scrollback nobody reads. Two carve-outs:
filterwarnings =
    error
    # Stripe's SDK still reaches for a few deprecated stdlib bits.
    default::DeprecationWarning
    # Starlette wants httpx2 for TestClient now. httpx still works; swap the
    # pin in requirements-dev.txt and drop this line when convenient.
    default::starlette.exceptions.StarletteDeprecationWarning
